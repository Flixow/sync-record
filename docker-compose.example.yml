# Example only. Copy to docker-compose.yml, create .env from .env.example, then:
#   docker compose up --build
services:
  collector:
    build: .
    env_file: .env
    environment:
      HOST: 0.0.0.0
      STORAGE_LOCAL_DIR: /data
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - recordings:/data
      # Speech models (downloaded on the first transcript job, about 1.6 GB); keep them across upgrades.
      - models:/models
    restart: unless-stopped

volumes:
  recordings:
  models:
